# Default values for workbuddy.
# Full v0.6 values surface for the K8s topology described in
# docs/decisions/2026-05-13-k8s-agentm-otel.md (Block 3 § Storage,
# Block 4 § Collector). MySQL and the OTel collector are reused from
# AegisLab via plain values references — NEITHER is bundled here as a
# subchart, per the decision doc.

# ----------------------------------------------------------------------
# Execution mode
# ----------------------------------------------------------------------
# "serve"       — single pod = coordinator + embedded worker (one process,
#                 shared DB). This is the K8s realization of the decision
#                 doc's "single-process in K8s" model and the only mode
#                 that can run runtime: agentm (the embedded worker owns
#                 the agentm subprocess + coordinator-managed publish).
# "coordinator" — poller + state machine only; CANNOT execute agentm
#                 (no worker to claim tasks). Kept for split topologies
#                 that pair it with a standalone `workbuddy worker`.
mode: serve

# Embedded-worker runtime capability advertised to the claim filter. Must
# be "agentm" for the sandbox topology; "claude-code"/"codex" are host-exec
# and not supported in K8s (see decision doc Block 2 mode matrix).
runtime: agentm

image:
  repository: docker.io/opspai/workbuddy-agentm   # combined workbuddy+agentm image (deploy/docker/Dockerfile)
  tag: ""          # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Coordinator HTTP API + webui port. Verified against cmd/coordinator.go
# (default 8081 in the binary; chart exposes 8080 as the service port).
service:
  type: ClusterIP
  port: 8080

# ----------------------------------------------------------------------
# MySQL
# ----------------------------------------------------------------------
# Workbuddy reuses AegisLab's MySQL cluster (REQ-135 / REQ-136). The
# coordinator stores the DSN in a Secret; plaintext .dsn is offered only
# for dev/quickstart. Production deployments SHOULD use .dsnSecretRef.
#
# DSN format (as consumed by internal/store/store.go::New):
#   mysql://<go-mysql-driver DSN>
# e.g.
#   mysql://wb:secret@tcp(mysql.aegislab.svc.cluster.local:3306)/workbuddy?parseTime=true&loc=UTC&multiStatements=true
#
# Env contract: the pod receives WORKBUDDY_MYSQL_DSN. Coordinator-side
# consumption is wired by the cmd/coordinator.go --db DSN-aware switch
# (today the flag still accepts a plain SQLite path; switching the
# coordinator to consume WORKBUDDY_MYSQL_DSN is tracked alongside this
# change). README.md "Env contract" documents the precedence.
mysql:
  dsn: ""                 # required (or set dsnSecretRef): full mysql:// DSN
  dsnSecretRef:           # optional: read the DSN from an existing Secret
    name: ""              #   Secret name. Empty disables the secretKeyRef path.
    key: dsn              #   Secret key holding the DSN string.

# ----------------------------------------------------------------------
# OpenTelemetry
# ----------------------------------------------------------------------
# Workbuddy honors the standard OTel SDK env vars (see
# internal/tracing/tracing.go). The chart maps these values onto:
#   - OTEL_EXPORTER_OTLP_ENDPOINT  (from otel.endpoint)
#   - OTEL_EXPORTER_OTLP_PROTOCOL  (from otel.protocol)
#   - OTEL_SERVICE_NAME            (from otel.serviceName)
# When endpoint is empty, tracing.Init() returns a no-op exporter —
# tracing is effectively disabled.
otel:
  endpoint: ""            # OTLP collector endpoint; empty = disabled
  protocol: grpc          # grpc | http/protobuf (http is accepted as alias)
  serviceName: workbuddy  # overrides OTEL_SERVICE_NAME default

# ----------------------------------------------------------------------
# Gitea / GitHub API token
# ----------------------------------------------------------------------
# Used by:
#   - The Coordinator's GitHub poller (gh CLI, reads GH_TOKEN).
#   - internal/labelwriter for AgentM-mode label writes against a Gitea
#     REST API (reads GITEA_TOKEN).
# The chart mounts a single Secret value into BOTH env vars so one
# token covers Gitea repos and GitHub repos transparently.
#
# Modes:
#   - secretName != "":  reference an existing Secret (recommended).
#   - secretName == "" && token != "":  chart materializes a Secret for
#                                       dev/quickstart only.
giteaToken:
  secretName: ""          # required for coordinator-managed mode
  secretKey: token        # key inside the Secret holding the token string
  token: ""               # plaintext token for dev only; ignored when secretName is set

# ----------------------------------------------------------------------
# Agent definitions
# ----------------------------------------------------------------------
# .github/workbuddy/agents/*.md mounted at /etc/workbuddy/agents.
#   - configMapName != "":  reference an existing ConfigMap.
#   - configMapName == "":  chart renders one from deploy/helm/workbuddy/agents/*.md.
agents:
  configMapName: ""
  # AgentM scenario referenced BY NAME (not a path). Resolved inside the
  # image from AGENTM_PROJECT_ROOT (deploy/docker/Dockerfile). The bundled
  # agent_env_repo scenario seeds the sandbox from the worktree's git HEAD
  # and syncs the agent's diff back — the cwd<->pod sync that makes
  # coordinator-managed PRs non-empty.
  scenarioName: sandbox
  model: ""                    # AgentM --model profile name (e.g. "litellm"); empty = AgentM default
  devTimeout: 30m
  reviewTimeout: 30m
  mergeTimeout: 15m
  specTimeout: 30m
  specReviewTimeout: 15m
  testGenTimeout: 30m

  # --- Agent prompts (Markdown body after the YAML frontmatter) ----------
  # Workbuddy template placeholders use {{.Issue.Number}} etc. — these are
  # NOT Helm variables; the chart escapes them so they pass through to the
  # workbuddy template engine at dispatch time.
  devPrompt: |
    You are working on issue #{{.Issue.Number}} in {{.Repo}}.

    Title: {{.Issue.Title}}

    Body:
    {{.Issue.Body}}

    {{.Issue.CommentsText}}

    The repo is cloned at /workspace. You have full git and gh CLI access.

    Read the issue body. If it contains a `## Test Artifacts` section, the
    test-gen agent has already written spec-derived tests. Pull the branch
    to get the test files, then:
    - Read the test file path(s) and run command from the Test Artifacts section
    - Run the tests — they should all FAIL (no implementation yet)
    - Implement the code to make all tests pass
    - Run the tests after each significant change to verify progress
    - All tests must pass before you push

    If there is no Test Artifacts section, implement the acceptance criteria
    directly and write your own tests.

    When done:
    - Commit and push to branch `workbuddy/issue-{{.Issue.Number}}`
    - Open a PR referencing this issue
    - Call `submit_result` with success=true, next_label="status:reviewing"
    Do NOT use `gh issue edit` to change labels — the orchestrator handles that.

  reviewPrompt: |
    You are reviewing the changes for issue #{{.Issue.Number}} in {{.Repo}}.

    Title: {{.Issue.Title}}

    Body:
    {{.Issue.Body}}

    {{.Issue.CommentsText}}

    The repo is at /workspace on the `workbuddy/issue-{{.Issue.Number}}` branch.
    Run `git diff main-base..HEAD` to see the changes.

    For each acceptance criterion, verify it is satisfied. Check for
    unrelated deletions, file truncation, or corruption.

    Post your review as a comment on the issue. Then call `submit_result`:
    - If all criteria pass:
      submit_result(success=true, next_label="status:merging")
    - If any fail:
      submit_result(success=false, next_label="status:developing",
        failure_reason="<list failing criteria>")
    Do NOT use `gh issue edit` to change labels.

  mergePrompt: |
    You are the merge gate for issue #{{.Issue.Number}} in {{.Repo}}.

    Title: {{.Issue.Title}}

    The repo is at /workspace on the `workbuddy/issue-{{.Issue.Number}}` branch.
    Run `git diff main-base..HEAD` to see the changes.

    Final quality check:
    - No accidental deletions or file truncation
    - Changed files pass syntax checks
    - Changes are focused and relevant to the issue

    If clean: merge the PR (`gh pr merge --squash --delete-branch -R {{.Repo}}`),
    close the issue (`gh issue close {{.Issue.Number}} -R {{.Repo}}`),
    then call submit_result(success=true, next_label="status:merged").

    If problems: comment with the reason, then call
    submit_result(success=false, next_label="status:developing",
      failure_reason="<describe the problem>").
    Do NOT use `gh issue edit` to change labels.

  # --- Engineering workflow agent prompts -----------------------------------
  specPrompt: |
    You are the spec agent for {{.Repo}}, working on issue #{{.Issue.Number}}.

    Title: {{.Issue.Title}}
    Body:
    {{.Issue.Body}}

    Previous comments:
    {{.Issue.CommentsText}}

    Read the issue body and comments. If the issue already has a well-structured
    spec with `## Interface` (function signatures, types, errors) and
    `## Acceptance Criteria` (numbered AC-1..N, each machine-testable), skip to
    the transition step.

    Otherwise, write the spec with three sections:
    1. **## Interface** — function signatures with types, API endpoints with
       schemas, error types and conditions, public vs internal boundaries.
    2. **## Acceptance Criteria** — numbered AC-1, AC-2, etc. Each must be
       testable: concrete input, expected output, no subjective terms.
    3. **## Design Notes** — architecture decisions, dependencies, constraints,
       out-of-scope.

    Read the `spec-writing` and `acceptance-criteria` skills for detailed
    guidance on what makes a good spec.

    IMPORTANT — write the spec into the issue BODY, not as a comment. Use
    `gh issue edit` to append the spec sections to the existing body:

    1. First read the current body: `gh issue view {{.Issue.Number}} -R {{.Repo}} --json body -q .body`
    2. Compose the new body = original body + your spec sections
    3. Update: `gh issue edit {{.Issue.Number}} -R {{.Repo}} --body "$NEW_BODY"`
    4. Verify the body was updated
    5. Call submit_result(success=true, next_label="status:spec-review")

    The review agent reads the issue body directly. Comments are filtered
    and compressed — a spec posted as a comment will not be seen.

    If the issue is too vague to derive any testable AC:
    Call submit_result(success=false, next_label="status:blocked",
      failure_reason="<what information is missing>")

    Do NOT use `gh issue edit` to change labels.

  specReviewPrompt: |
    You are the spec review agent for {{.Repo}}, reviewing issue #{{.Issue.Number}}.

    Title: {{.Issue.Title}}
    Body:
    {{.Issue.Body}}

    Previous comments (including the spec):
    {{.Issue.CommentsText}}

    Find the spec (## Interface + ## Acceptance Criteria). If no spec exists,
    post "No spec found" and flip back to specifying.

    For each AC, assess:
    - **Testable**: can a deterministic test pass/fail on this criterion alone?
    - **Specific**: does it reference concrete names/types from the Interface?

    Post a verdict table:
    | AC | Testable | Specific | Issue |
    |----|----------|----------|-------|
    Then flip the label:
    - All ACs testable + interface complete:
      submit_result(success=true, next_label="status:test-generating")
    - Any issue found:
      submit_result(success=false, next_label="status:specifying",
        failure_reason="<list untestable ACs>")

    Do NOT use `gh issue edit` to change labels.
    Read the `acceptance-criteria` skill for testability rules.

  testGenPrompt: |
    You are the test generation agent for {{.Repo}}, issue #{{.Issue.Number}}.

    Title: {{.Issue.Title}}
    Body:
    {{.Issue.Body}}

    Previous comments (including spec and spec review):
    {{.Issue.CommentsText}}

    Find the approved spec. For EACH acceptance criterion (AC-1, AC-2, ...),
    write at least one integration test. Rules:
    - Name: test_ac1_<description>, test_ac2_<description>, etc.
    - Import from the Interface definitions — use exact names from the spec.
    - Test the SPEC, not code. You have NOT seen any implementation.
    - Focus on exception branches and invariants — these find bugs.
    - Run tests and verify they FAIL (no implementation exists yet).

    Read the `test-design` skill for the invariant-first test methodology.

    IMPORTANT — ordering matters:
    1. Commit tests and push to `workbuddy/issue-{{.Issue.Number}}`
    2. Append a `## Test Artifacts` section to the issue body listing:
       - The test file path(s) relative to repo root
       - The test run command (e.g. `pytest tests/test_health.py -v` or
         `go test ./src/shipping/... -run TestAC -v`)
       - The test-to-AC mapping table
       Use `gh issue edit` to append to the body (read current body first,
       append, write back — same as the spec agent does).
    3. VERIFY the body was updated
    4. Call submit_result(success=true, next_label="status:developing")

    Never call submit_result before tests are pushed and the artifacts
    section is written.

    Do NOT write any implementation code. Only test files.
    Do NOT use `gh issue edit` to change labels.

# Ingress for the coordinator Service. Disabled by default; enable in K8s
# topologies that need external webui + webhook access (decision doc Block 3
# § Chart layout). Three routes are exposed when enabled: /webui, /api,
# and /webhook — all backed by the same coordinator Service port.
# cert-manager / ACME integration is out of scope: set tls.secretName to an
# existing TLS Secret if you need HTTPS.
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# ----------------------------------------------------------------------
# Coordinator config (rendered into config.yaml in the mounted config-dir)
# ----------------------------------------------------------------------
# The single repository the coordinator polls. The init container clones it
# into the workspace volume so the embedded worker can `git worktree add`.
# Multi-repo fan-out (dynamic worker repo registration) is out of scope for
# this chart; deploy one release per repo, or extend with --repos.
config:
  repo: ""                     # required, "OWNER/NAME" form
  environment: dev
  pollInterval: 15s
  # Default branch to clone/track. Empty = the remote's default branch.
  branch: ""

# Workflow Markdown mounted at <config-dir>/workflows/default.md. The chart
# ships the standard 2-agent (dev → review) state machine; override to point
# at your own by setting workflow.inline to the full Markdown document.
workflow:
  inline: ""                   # empty = use the bundled default workflow

# ----------------------------------------------------------------------
# Coordinator HTTP bind + auth
# ----------------------------------------------------------------------
# In K8s the process must bind 0.0.0.0 so the Service / kubelet probes can
# reach it, which workbuddy requires --auth for (a non-loopback bind without
# auth is rejected). The embedded worker authenticates to the in-pod
# coordinator with the same token, so a token is mandatory in serve mode.
auth:
  token: ""                    # plaintext; chart materializes a Secret (dev)
  secretName: ""               # or reference an existing Secret (recommended)
  secretKey: token

# URL written into GitHub issue comments as the prefix of session links.
# Required because the process binds non-loopback. Defaults to the in-cluster
# Service DNS (not browser-clickable but valid); set to your ingress host for
# clickable links.
reportBaseURL: ""

# ----------------------------------------------------------------------
# agent-env (ARL sandbox Gateway) — consumed by the agentm subprocess
# ----------------------------------------------------------------------
# workbuddy Go never talks to the Gateway; the agentm CLI does, via these
# AGENTM_AGENT_ENV_* env vars. agent-env is a SEPARATE Helm release; point
# gatewayUrl at its in-cluster Service.
agentEnv:
  gatewayUrl: ""               # required, e.g. http://arl-operator-gateway.arl.svc:8080
  image: ""                    # sandbox dev-container image, e.g. otel-demo-dev:latest
  experimentId: workbuddy      # AGENTM_AGENT_ENV_EXPERIMENT_ID

# ----------------------------------------------------------------------
# AgentM config.toml — model profiles for the agentm subprocess
# ----------------------------------------------------------------------
# When configSecretName is set, the Secret's `config.toml` key is mounted
# at $AGENTM_HOME/config.toml so the agentm CLI can resolve model profiles
# (e.g. `--model litellm`). This replaces per-env-var model wiring and
# keeps API keys + endpoints in one file. Precedence (per AgentM docs):
# CLI flag > env var > profile > built-in default — so remove conflicting
# env vars from providerKeys when using config.toml profiles.
agentm:
  configSecretName: ""         # existing Secret with a `config.toml` key

# ----------------------------------------------------------------------
# Provider API keys for the agentm subprocess (ANTHROPIC_API_KEY,
# OPENAI_API_KEY, CRS_OAI_KEY, …). All keys in the referenced Secret are
# injected as env via envFrom. Leave empty to inherit nothing (the agent
# will fail at model-call time).
# ----------------------------------------------------------------------
providerKeys:
  secretName: ""               # existing Secret; every key becomes an env var

# ----------------------------------------------------------------------
# Workspace volume — holds the repo clone, per-issue worktrees, and (by
# default) the SQLite DB under .workbuddy/. Use a PVC for persistence across
# restarts; emptyDir is fine for ephemeral test runs.
# ----------------------------------------------------------------------
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /var/lib/workbuddy

# ----------------------------------------------------------------------
# PM Agent CronJob — autonomous requirement proposer
# ----------------------------------------------------------------------
# Self-managed (has GH_TOKEN, runs on host, no sandbox). Reads open/closed
# issues, recent PRs, and source code, then creates 1-2 new issues with
# acceptance criteria and the `workbuddy` + `status:developing` labels.
pm:
  enabled: false
  schedule: "*/15 * * * *"      # every 15 minutes
  prompt: |
    You are the PM agent for LGU-SE-Internal/opentelemetry-demo.

    Your perspective: "What's missing before this demo app can serve real
    production traffic?" Scan the codebase and open ONE well-scoped issue
    per run that closes a production-readiness gap.

    ## Process

    1. Check existing issues to avoid duplicates:
       gh issue list -R LGU-SE-Internal/opentelemetry-demo --state open --limit 30 --label engineering

    2. Scan the codebase for production gaps. Look at areas like:
       - Services missing health/readiness endpoints (grep for /health in each service)
       - Missing or inadequate error handling (empty catch blocks, unwrap without context)
       - Hardcoded config that should be env vars (ports, URLs, timeouts)
       - Missing graceful shutdown handling
       - Lack of request validation or input sanitization
       - Missing rate limiting or circuit breakers
       - Insufficient structured logging (println vs tracing/logging framework)
       - Missing metrics endpoints or key business metrics
       - No retry/backoff on inter-service calls
       - Missing TLS/mTLS configuration
       - Docker/K8s configs missing resource limits, probes, or security context
       Pick ONE concrete gap, not a vague "improve X".

    3. Read the specific source files to confirm the gap exists.

    4. Create exactly ONE issue:
       gh issue create -R LGU-SE-Internal/opentelemetry-demo \
         --title "<verb> <specific thing> in <service>" \
         --body "<body>" \
         --label "engineering" --label "status:specifying"

       Body format:
       ## Goal
       One sentence: what production problem this solves.

       ## Context
       Which service, which files, what's currently missing.
       Name the language and directory (e.g. `src/shipping/`, Rust).

       ## Rough Requirements
       3-5 bullet points. Keep it high-level — the spec-agent will
       flesh out the interface and acceptance criteria.

    Rules:
    - ONE issue per run, no more.
    - Never duplicate an open issue (check the list first).
    - Title must name the specific service (e.g. "shipping", "frontend", "cart").
    - Labels must be exactly: engineering, status:specifying.
    - Each issue should be completable in one dev-agent session (~15 min).
    - Rotate across services — don't keep targeting the same one.

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
