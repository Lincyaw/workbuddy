{{- /*
Agent-configs ConfigMap (mounted at <config-dir>/agents). Rendered only when
the user has not pointed at an existing one via .Values.agents.configMapName.

The chart ships templated defaults for the three-role catalog (dev + review +
merge), all runtime: agentm in coordinator-managed mode. They are rendered
(not read from .Files) so the sandbox image (.Values.agentEnv.image) and the
in-image scenario path (.Values.agents.scenarioPath) are injected from values
and stay consistent with deploy/docker/Dockerfile.

Agent prompt bodies live in .Values.agents.{dev,review,merge}Prompt so
operators can override them without forking the chart. The prompts contain
workbuddy template placeholders ({{ .Issue.Number }} etc.) — these look like
Helm variables but must pass through verbatim. We use
  {{ "{{" }} and {{ "}}" }}
to escape them in the YAML frontmatter (where they appear inline), and for
the prompt body we pipe .Values through a regex replace that converts every
{{ X }} into the escaped form Helm emits literally.
*/ -}}
{{- /* Prompts in values.yaml use the escaped form directly:
     {{ "{{" }}.Issue.Number{{ "}}" }} — Helm passes it through verbatim.
     No helper needed; nindent handles the indentation. */ -}}
{{- if not .Values.agents.configMapName }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workbuddy.agentsConfigMapName" . }}
  labels:
    {{- include "workbuddy.labels" . | nindent 4 }}
data:
  dev-agent.md: |
    ---
    name: dev-agent
    description: AgentM dev agent (agent-env sandbox, repo-synced)
    triggers:
      - state: developing
    role: dev
    runtime: agentm
    scenario: {{ .Values.agents.scenarioName }}
    {{- if .Values.agentEnv.image }}
    dev_container_image: {{ .Values.agentEnv.image }}
    {{- end }}
    extensions:
      - module: agentm.extensions.builtin.tool_result_cap
        config:
          max_chars: 24000
          preview_chars: 6000
      - module: agentm.extensions.builtin.dedup
      - module: agentm.extensions.builtin.retry_policy
      - module: agentm.extensions.builtin.runtime_context
      - module: agentm.extensions.builtin.tool_error_messages
      - module: agentm.extensions.builtin.tool_bash_guard
      - module: agentm.extensions.builtin.skill_loader
        config:
          skill_paths:
            - /workspace/.agentm/skills
          include_defaults: false
          inherit_claude: false
    policy:
      sandbox: danger-full-access
      approval: never
      timeout: {{ .Values.agents.devTimeout | default "30m" }}
      {{- if .Values.agents.model }}
      model: {{ .Values.agents.model }}
      {{- end }}
    context:
      - Repo
      - Issue.Number
      - Issue.Title
      - Issue.Body
    ---

    {{ .Values.agents.devPrompt | default "" | nindent 4 }}
  review-agent.md: |
    ---
    name: review-agent
    description: AgentM review agent (agent-env sandbox, repo-synced)
    triggers:
      - state: reviewing
    role: review
    runtime: agentm
    scenario: {{ .Values.agents.scenarioName }}
    {{- if .Values.agentEnv.image }}
    dev_container_image: {{ .Values.agentEnv.image }}
    {{- end }}
    extensions:
      - module: agentm.extensions.builtin.tool_result_cap
        config:
          max_chars: 24000
          preview_chars: 6000
      - module: agentm.extensions.builtin.dedup
      - module: agentm.extensions.builtin.retry_policy
      - module: agentm.extensions.builtin.runtime_context
      - module: agentm.extensions.builtin.tool_error_messages
      - module: agentm.extensions.builtin.tool_bash_guard
      - module: agentm.extensions.builtin.skill_loader
        config:
          skill_paths:
            - /workspace/.agentm/skills
          include_defaults: false
          inherit_claude: false
    policy:
      sandbox: danger-full-access
      approval: never
      timeout: {{ .Values.agents.reviewTimeout | default "30m" }}
      {{- if .Values.agents.model }}
      model: {{ .Values.agents.model }}
      {{- end }}
    context:
      - Repo
      - Issue.Number
      - Issue.Title
      - Issue.Body
    ---

    {{ .Values.agents.reviewPrompt | default "" | nindent 4 }}
  merge-agent.md: |
    ---
    name: merge-agent
    description: AgentM merge agent (agent-env sandbox, repo-synced)
    triggers:
      - state: merging
    role: merge
    runtime: agentm
    scenario: {{ .Values.agents.scenarioName }}
    {{- if .Values.agentEnv.image }}
    dev_container_image: {{ .Values.agentEnv.image }}
    {{- end }}
    extensions:
      - module: agentm.extensions.builtin.tool_result_cap
        config:
          max_chars: 24000
          preview_chars: 6000
      - module: agentm.extensions.builtin.dedup
      - module: agentm.extensions.builtin.retry_policy
      - module: agentm.extensions.builtin.runtime_context
      - module: agentm.extensions.builtin.tool_error_messages
      - module: agentm.extensions.builtin.tool_bash_guard
      - module: agentm.extensions.builtin.skill_loader
        config:
          skill_paths:
            - /workspace/.agentm/skills
          include_defaults: false
          inherit_claude: false
    policy:
      sandbox: danger-full-access
      approval: never
      timeout: {{ .Values.agents.mergeTimeout | default "15m" }}
      {{- if .Values.agents.model }}
      model: {{ .Values.agents.model }}
      {{- end }}
    context:
      - Repo
      - Issue.Number
      - Issue.Title
      - Issue.Body
    ---

    {{ .Values.agents.mergePrompt | default "" | nindent 4 }}
{{- end }}
