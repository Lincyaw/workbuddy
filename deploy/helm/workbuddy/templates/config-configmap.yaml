{{- /*
Coordinator config-dir contents: config.yaml (repo + poll settings) and the
workflow Markdown. Mounted via subPath into {{ include "workbuddy.configDir" . }}
so it composes with the agents ConfigMap at <config-dir>/agents.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workbuddy.configConfigMapName" . }}
  labels:
    {{- include "workbuddy.labels" . | nindent 4 }}
data:
  config.yaml: |
    environment: {{ .Values.config.environment | default "dev" }}
    repo: {{ required "config.repo is required (OWNER/NAME)" .Values.config.repo | quote }}
    poll_interval: {{ .Values.config.pollInterval | default "15s" }}
    port: {{ .Values.service.port }}
    notifications:
      enabled: false
  workflow-default.md: |
{{- if .Values.workflow.inline }}
{{ .Values.workflow.inline | indent 4 }}
{{- else }}
    ---
    name: default
    description: Three-agent lifecycle (dev → review → merge) for workbuddy-tracked issues
    trigger:
      issue_label: "workbuddy"
    max_retries: 3
    max_review_cycles: 3
    ---

    ## Default Workflow

    Built-in default preset (dev → review → merge): dev implements, review
    verifies, merge ships. `synthesizing` is a conditional rollout-reduction
    branch between develop and review (single-rollout issues skip it). In
    coordinator-managed (agentm) mode workbuddy flips labels using the
    structured `next_label` the agent returns and squash-merges the PR when
    the merge-agent approves. This mirrors the in-repo preset at
    `.github/workbuddy/workflows/default.md`.

    ```yaml
    states:
      developing:
        enter_label: "status:developing"
        agent: dev-agent
        transitions:
          "status:synthesizing": synthesizing
          "status:reviewing": reviewing
          "status:blocked": blocked

      synthesizing:
        enter_label: "status:synthesizing"
        agent: review-agent
        mode: synthesize
        transitions:
          "status:reviewing": reviewing

      reviewing:
        enter_label: "status:reviewing"
        agent: review-agent
        transitions:
          "status:merging": merging
          "status:developing": developing

      merging:
        enter_label: "status:merging"
        agent: merge-agent
        transitions:
          "status:merged": merged
          "status:developing": developing

      merged:
        enter_label: "status:merged"

      blocked:
        enter_label: "status:blocked"
        transitions:
          "status:developing": developing

      failed:
        enter_label: "status:failed"
    ```
{{- end }}
  workflow-engineering.md: |
    ---
    name: engineering
    description: Spec-driven engineering workflow (spec → spec-review → test-gen → dev → review → merge)
    trigger:
      issue_label: "engineering"
    max_retries: 3
    max_review_cycles: 3
    ---

    ## Engineering Workflow

    Spec-driven pipeline. Tests are generated from the spec BEFORE the
    implementation exists: spec-review hands off to a dedicated test-generating
    stage, then the dev agent implements against those tests. This mirrors the
    in-repo preset at `.github/workbuddy/workflows/engineering.md`.

    ```yaml
    states:
      specifying:
        enter_label: "status:specifying"
        agent: spec-agent
        transitions:
          "status:spec-review": spec_review
          "status:blocked": blocked

      spec_review:
        enter_label: "status:spec-review"
        agent: spec-review-agent
        transitions:
          "status:test-generating": test_generating
          "status:specifying": specifying

      test_generating:
        enter_label: "status:test-generating"
        agent: test-gen-agent
        transitions:
          "status:developing": developing
          "status:blocked": blocked

      developing:
        enter_label: "status:developing"
        agent: dev-agent
        transitions:
          "status:reviewing": reviewing
          "status:blocked": blocked

      reviewing:
        enter_label: "status:reviewing"
        agent: review-agent
        transitions:
          "status:merging": merging
          "status:developing": developing

      merging:
        enter_label: "status:merging"
        agent: merge-agent
        transitions:
          "status:merged": merged
          "status:developing": developing

      merged:
        enter_label: "status:merged"

      blocked:
        enter_label: "status:blocked"
        transitions:
          "status:specifying": specifying
          "status:developing": developing

      failed:
        enter_label: "status:failed"
    ```
