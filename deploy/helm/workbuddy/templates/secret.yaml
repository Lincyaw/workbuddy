{{- /*
Only render a Secret if the user did NOT supply an existing Secret name.
In production they should pre-create the Secret out-of-band (sealed-secrets,
ExternalSecrets, etc.) and set .Values.giteaToken.secretName to its name.
This in-chart path is for dev / quick-start only. The Secret key matches
.Values.giteaToken.secretKey (default "token") so the deployment's
secretKeyRef and the chart-managed Secret agree.
*/ -}}
{{- if and (not .Values.giteaToken.secretName) .Values.giteaToken.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workbuddy.giteaSecretName" . }}
  labels:
    {{- include "workbuddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.giteaToken.secretKey | default "token" }}: {{ .Values.giteaToken.token | quote }}
{{- end }}
{{- /*
Auth-token Secret for the coordinator HTTP surface + embedded worker. Same
dev/quickstart-only pattern: rendered when auth.token is set and no existing
auth.secretName is supplied. In serve mode a token is mandatory (the process
binds 0.0.0.0 and --auth is required), so the deployment fails fast if neither
auth.token nor auth.secretName is provided.
*/ -}}
{{- if and (not .Values.auth.secretName) .Values.auth.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workbuddy.authSecretName" . }}
  labels:
    {{- include "workbuddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey | default "token" }}: {{ .Values.auth.token | quote }}
{{- end }}
